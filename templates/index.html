<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Mart Simulator 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; user-select: none; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #ffeb3b;
        }
        #money { color: #00e676; font-size: 17px; }
        
        #store-sign {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 152, 0, 0.95);
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #message {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffeb3b;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ffeb3b;
            max-width: 80%;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
        }
        
        .control-btn {
            position: absolute;
            bottom: 50px;
            width: 75px;
            height: 75px;
            background: rgba(255, 235, 59, 0.25);
            border: 2px solid rgba(255, 235, 59, 0.8);
            border-radius: 50%;
            color: #ffeb3b;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        #action-btn { right: 25px; background: rgba(0, 230, 118, 0.35); border-color: #00e676; color: #00e676; font-size: 11px; text-align: center;}
        
        #joystick-base {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.9);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px #000;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="ui">
        💰 Tiền: <span id="money">150</span>$<br>
        📦 Thùng hàng cầm tay: <span id="carried-goods">0</span>/3<br>
        🛒 Kệ trống cần bầy: <span id="empty-shelves">3</span>/3
    </div>
    
    <div id="store-sign">🏪 MINI MART SIMULATOR</div>

    <div id="crosshair"></div>
    <div id="message">Chào mừng ông chủ bắt đầu quản lý siêu thị!</div>
    <div id="hint">Vuốt màn hình để nhìn quanh | Dùng joystick bên trái để đi chuyển</div>

    <div id="action-btn" class="control-btn">TƯƠNG TÁC</div>
    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        // Sàn nhà
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), new THREE.MeshBasicMaterial({ color: 0xecf0f1 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Tường xung quanh
        const wallMat = new THREE.MeshBasicMaterial({ color: 0xffecb3 });
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(22, 5, 0.5), wallMat);
        backWall.position.set(0, 2.5, -11);
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 22), wallMat);
        leftWall.position.set(-11, 2.5, 0);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 22), wallMat);
        rightWall.position.set(11, 2.5, 0);
        scene.add(rightWall);

        const frontLeft = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 0.5), wallMat);
        frontLeft.position.set(-6.5, 2.5, 11);
        scene.add(frontLeft);

        const frontRight = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 0.5), wallMat);
        frontRight.position.set(6.5, 2.5, 11);
        scene.add(frontRight);

        const doorGlass = new THREE.Mesh(
            new THREE.BoxGeometry(3.8, 3, 0.1), 
            new THREE.MeshBasicMaterial({ color: 0x81d4fa, transparent: true, opacity: 0.5 })
        );
        doorGlass.position.set(0, 1.5, 11);
        scene.add(doorGlass);

        // 3 Kệ hàng
        const shelves = [];
        const shelfMat = new THREE.MeshBasicMaterial({ color: 0x795548 });
        const shelfBoardMat = new THREE.MeshBasicMaterial({ color: 0xa1887f });

        [-5, 0, 5].forEach((xPos, index) => {
            const shelfGroup = new THREE.Group();
            
            const side1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), shelfMat);
            side1.position.set(-1.6, 1.25, 0);
            shelfGroup.add(side1);

            const side2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), shelfMat);
            side2.position.set(1.6, 1.25, 0);
            shelfGroup.add(side2);

            [0.3, 1.1, 1.9].forEach(yPos => {
                const board = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.95), shelfBoardMat);
                board.position.set(0, yPos, 0);
                shelfGroup.add(board);
            });

            shelfGroup.position.set(xPos, 0, -7);
            scene.add(shelfGroup);
            shelves.push({ id: index + 1, group: shelfGroup, hasGoods: false, x: xPos, z: -7 });
        });

        // Bàn máy tính nhập hàng
        const desk = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.0, 1.3), new THREE.MeshBasicMaterial({ color: 0x37474f }));
        desk.position.set(-8, 0.5, -8);
        scene.add(desk);

        const pcScreen = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.08), new THREE.MeshBasicMaterial({ color: 0x111111 }));
        pcScreen.position.set(-8, 1.35, -8);
        scene.add(pcScreen);
        const pcDisplay = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.02), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
        pcDisplay.position.set(-8, 1.35, -7.95);
        scene.add(pcDisplay);

        // Quầy thu ngân
        const counter = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.0, 1.8), new THREE.MeshBasicMaterial({ color: 0x0288d1 }));
        counter.position.set(5, 0.5, 2);
        scene.add(counter);

        // Khách hàng
        const customerGroup = new THREE.Group();
        const cBody = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.1, 8), new THREE.MeshBasicMaterial({ color: 0xe91e63 }));
        cBody.position.set(0, 0.55, 0);
        customerGroup.add(cBody);
        const cHead = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffccbc }));
        cHead.position.set(0, 1.3, 0);
        customerGroup.add(cHead);
        customerGroup.position.set(0, 0, 12); // Bắt đầu từ cửa chính (ảnh 2)
        scene.add(customerGroup);

        let money = 150;
        let carriedGoods = 0;
        
        // Trạng thái khách hàng: walking_in -> browsing (10s) -> going_to_counter -> waiting -> leaving
        let customerState = 'walking_in';
        let browseTimer = 0;

        camera.position.set(0, 1.6, -2);
        let yaw = 0;
        let pitch = 0;

        function showMsg(txt) {
            const m = document.getElementById('message');
            m.innerText = txt;
            m.style.opacity = '1';
            setTimeout(() => { m.style.opacity = '0'; }, 2000);
        }

        // Tối ưu hóa điều khiển xoay màn hình mượt mà mọi nơi
        let lookTouchId = null;
        let prevX = 0, prevY = 0;

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                // Nếu không bấm vào nút joystick hay action thì nhận diện là vuốt nhìn quanh
                if (!t.target.closest('#action-btn') && !t.target.closest('#joystick-base') && !t.target.closest('#ui')) {
                    if (lookTouchId === null) {
                        lookTouchId = t.identifier;
                        prevX = t.clientX;
                        prevY = t.clientY;
                    }
                }
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (lookTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === lookTouchId) {
                    let dx = t.clientX - prevX;
                    let dy = t.clientY - prevY;
                    yaw -= dx * 0.004;
                    pitch -= dy * 0.004;
                    if (pitch > 1.4) pitch = 1.4;
                    if (pitch < -1.4) pitch = -1.4;
                    prevX = t.clientX;
                    prevY = t.clientY;
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        });

        // Joystick điều khiển di chuyển
        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, z: 0 };
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickTouchId = e.changedTouches[0].identifier;
        });

        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const rect = joystickBase.getBoundingClientRect();
                    let dx = touch.clientX - (rect.left + rect.width / 2);
                    let dy = touch.clientY - (rect.top + rect.height / 2);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxR = 45;
                    if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveVector.x = dx / maxR;
                    moveVector.z = dy / maxR;
                }
            }
        });

        const resetJoystick = () => {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        };
        joystickBase.addEventListener('touchend', resetJoystick);
        joystickBase.addEventListener('touchcancel', resetJoystick);

        document.getElementById('action-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            const px = camera.position.x;
            const pz = camera.position.z;

            // Nhập hàng tại máy tính
            if (Math.abs(px - (-8)) < 2.5 && Math.abs(pz - (-8)) < 2.5) {
                if (money >= 20 && carriedGoods < 3) {
                    money -= 20;
                    carriedGoods++;
                    document.getElementById('money').innerText = money;
                    document.getElementById('carried-goods').innerText = carriedGoods;
                    showMsg("📦 Đã nhập thùng hàng (Rau/Thịt/Nước)!");
                } else {
                    showMsg("⚠️ Không đủ tiền hoặc đầy tay!");
                }
                return;
            }

            // Thanh toán tại quầy
            if (Math.abs(px - 5) < 3 && Math.abs(pz - 2) < 3) {
                if (customerState === 'waiting') {
                    customerState = 'leaving';
                    money += 50;
                    document.getElementById('money').innerText = money;
                    showMsg("💵 Khách đã thanh toán xong! +50$");
                }
                return;
            }

            // Bầy hàng lên kệ
            shelves.forEach(shelf => {
                if (Math.abs(px - shelf.x) < 2.2 && Math.abs(pz - shelf.z) < 2.2 && !shelf.hasGoods && carriedGoods > 0) {
                    carriedGoods--;
                    shelf.hasGoods = true;
                    
                    const itemColors = [0x4caf50, 0xf44336, 0x03a9f4];
                    [0.4, 1.2, 2.0].forEach((yP, idx) => {
                        const product = new THREE.Mesh(
                            new THREE.BoxGeometry(0.5, 0.4, 0.6), 
                            new THREE.MeshBasicMaterial({ color: itemColors[idx] })
                        );
                        product.position.set((Math.random() - 0.5) * 1.5, yP, (Math.random() - 0.5) * 0.4);
                        shelf.group.add(product);
                    });

                    document.getElementById('carried-goods').innerText = carriedGoods;
                    document.getElementById('empty-shelves').innerText = shelves.filter(s => !s.hasGoods).length;
                    showMsg("🛒 Đã bầy hàng lên kệ đầy đủ!");
                }
            });
        });

        const speed = 0.08;
        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Logic khách hàng đi từ cửa vào trong kệ lựa hàng rồi mới ra quầy
            if (customerState === 'walking_in') {
                customerGroup.position.z -= 0.03;
                if (customerGroup.position.z <= -4) { // Đi hẳn vào khu vực giữa các kệ hàng
                    customerState = 'browsing';
                    browseTimer = 0;
                    showMsg("🛍️ Khách đang đi lựa chọn hàng hóa...");
                }
            } else if (customerState === 'browsing') {
                browseTimer += 1;
                if (browseTimer > 600) { // Lựa hàng trong vòng 10 giây
                    customerState = 'going_to_counter';
                }
            } else if (customerState === 'going_to_counter') {
                customerGroup.position.z += 0.03;
                if (customerGroup.position.z >= 4.5) {
                    customerGroup.position.z = 4.5;
                    customerState = 'waiting';
                    showMsg("🚨 Có khách đang chờ thanh toán tại quầy!");
                }
            } else if (customerState === 'leaving') {
                customerGroup.position.z += 0.04;
                if (customerGroup.position.z > 13) {
                    customerGroup.position.set(0, 0, 12); // Reset về vị trí cửa chính
                    customerState = 'walking_in';
                }
            }

            if (moveVector.x !== 0 || moveVector.z !== 0) {
                const moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.z);
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                camera.position.x += moveDir.x * speed;
                camera.position.z += moveDir.z * speed;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
