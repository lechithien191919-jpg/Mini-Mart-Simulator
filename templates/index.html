<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Mart Simulator 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; user-select: none; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #ffeb3b;
        }
        #money { color: #00e676; font-size: 17px; }
        
        #store-sign {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 152, 0, 0.95);
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #message {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffeb3b;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ffeb3b;
            max-width: 80%;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
        }
        
        .control-btn {
            position: absolute;
            bottom: 50px;
            width: 75px;
            height: 75px;
            background: rgba(255, 235, 59, 0.25);
            border: 2px solid rgba(255, 235, 59, 0.8);
            border-radius: 50%;
            color: #ffeb3b;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        #action-btn { right: 25px; background: rgba(0, 230, 118, 0.35); border-color: #00e676; color: #00e676; font-size: 11px; text-align: center;}
        
        #joystick-base {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.9);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px #000;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="ui">
        💰 Tiền: <span id="money">150</span>$<br>
        📦 Thùng hàng cầm tay: <span id="carried-goods">0</span>/3<br>
        🛒 Kệ trống cần bầy: <span id="empty-shelves">3</span>/3
    </div>
    
    <div id="store-sign">🏪 MINI MART SIMULATOR</div>

    <div id="crosshair"></div>
    <div id="message">Chào mừng ông chủ bắt đầu quản lý siêu thị!</div>
    <div id="hint">Vuốt màn hình để nhìn quanh | Dùng joystick bên trái để đi chuyển</div>

    <div id="action-btn" class="control-btn">TƯƠNG TÁC</div>
    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        // Mây trời
        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        for (let i = 0; i < 6; i++) {
            const cloud = new THREE.Mesh(new THREE.BoxGeometry(5, 1.2, 2.5), cloudMat);
            cloud.position.set((Math.random() - 0.5) * 30, 14 + Math.random() * 4, -15 + (Math.random() - 0.5) * 30);
            scene.add(cloud);
        }

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
        scene.add(ambientLight);

        // Sàn và Trần
        const floorGeo = new THREE.PlaneGeometry(22, 22);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0xecf0f1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceilingGeo = new THREE.PlaneGeometry(22, 22);
        const ceilingMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(0, 5, 0);
        scene.add(ceiling);

        // Đèn trần
        const lightBoxMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        [-5, 0, 5].forEach(xPos => {
            const lamp = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 1.5), lightBoxMat);
            lamp.position.set(xPos, 4.9, 0);
            scene.add(lamp);
        });

        // --- DANH SÁCH KHU VỰC VA CHẠM (COLLISION BOXES) ---
        const obstacles = [
            { x: 0, z: -10.75, width: 22, depth: 0.5 }, // Tường sau
            { x: -10.75, z: 0, width: 0.5, depth: 22 }, // Tường trái
            { x: 10.75, z: 0, width: 0.5, depth: 22 },  // Tường phải
            
            // 3 Kệ hàng
            { x: -5, z: -7, width: 3.4, depth: 1.2 },
            { x: 0, z: -7, width: 3.4, depth: 1.2 },
            { x: 5, z: -7, width: 3.4, depth: 1.2 },

            // Bàn máy tính nhập hàng
            { x: -8, z: -8, width: 2.7, depth: 1.5 },

            // Quầy thu ngân
            { x: 5, z: 2, width: 4.0, depth: 2.0 }
        ];

        // Tường trực quan & Cửa ra vào phía trước (Z = 11)
        const wallMat = new THREE.MeshBasicMaterial({ color: 0xffecb3 });
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(22, 5, 0.5), wallMat);
        backWall.position.set(0, 2.5, -11);
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 22), wallMat);
        leftWall.position.set(-11, 2.5, 0);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 22), wallMat);
        rightWall.position.set(11, 2.5, 0);
        scene.add(rightWall);

        const frontWallLeft = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 0.5), wallMat);
        frontWallLeft.position.set(-6.5, 2.5, 11);
        scene.add(frontWallLeft);

        const frontWallRight = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 0.5), wallMat);
        frontWallRight.position.set(6.5, 2.5, 11);
        scene.add(frontWallRight);

        const frontWallTop = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.5), wallMat);
        frontWallTop.position.set(0, 4, 11);
        scene.add(frontWallTop);

        const doorGlassMat = new THREE.MeshBasicMaterial({ color: 0x81d4fa, transparent: true, opacity: 0.5 });
        const glassDoor = new THREE.Mesh(new THREE.BoxGeometry(3.8, 3, 0.1), doorGlassMat);
        glassDoor.position.set(0, 1.5, 11);
        scene.add(glassDoor);

        // --- KỆ HÀNG CHÂN THẬT (NHIỀU TẦNG) ---
        const shelves = [];
        const shelfPositions = [
            { x: -5, z: -7 },
            { x: 0, z: -7 },
            { x: 5, z: -7 }
        ];

        const shelfMat = new THREE.MeshBasicMaterial({ color: 0x795548 });
        const shelfBoardMat = new THREE.MeshBasicMaterial({ color: 0xa1887f });

        shelfPositions.forEach((pos, index) => {
            const shelfGroup = new THREE.Group();
            
            const sideLeft = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), shelfMat);
            sideLeft.position.set(-1.6, 1.25, 0);
            shelfGroup.add(sideLeft);

            const sideRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), shelfMat);
            sideRight.position.set(1.6, 1.25, 0);
            shelfGroup.add(sideRight);

            [0.3, 1.1, 1.9].forEach(yPos => {
                const board = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.95), shelfBoardMat);
                board.position.set(0, yPos, 0);
                shelfGroup.add(board);
            });

            shelfGroup.position.set(pos.x, 0, pos.z);
            scene.add(shelfGroup);

            shelves.push({ id: index + 1, group: shelfGroup, hasGoods: false, x: pos.x, z: pos.z });
        });

        // --- BÀN MÁY TÍNH CHÂN THẬT ---
        const desk = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.0, 1.3), new THREE.MeshBasicMaterial({ color: 0x37474f }));
        desk.position.set(-8, 0.5, -8);
        scene.add(desk);

        const pcCase = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.7), new THREE.MeshBasicMaterial({ color: 0x212121 }));
        pcCase.position.set(-8.8, 0.35, -8);
        scene.add(pcCase);

        const pcScreen = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.08), new THREE.MeshBasicMaterial({ color: 0x111111 }));
        pcScreen.position.set(-8, 1.35, -8);
        scene.add(pcScreen);

        const pcDisplay = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.02), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
        pcDisplay.position.set(-8, 1.35, -7.95);
        scene.add(pcDisplay);

        const keyboard = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.04, 0.25), new THREE.MeshBasicMaterial({ color: 0x212121 }));
        keyboard.position.set(-8, 1.03, -7.6);
        scene.add(keyboard);

        const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.15), new THREE.MeshBasicMaterial({ color: 0x424242 }));
        mouse.position.set(-7.3, 1.03, -7.6);
        scene.add(mouse);

        // --- QUẦY THU NGÂN ---
        const counter = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.0, 1.8), new THREE.MeshBasicMaterial({ color: 0x0288d1 }));
        counter.position.set(5, 0.5, 2);
        scene.add(counter);

        const cashRegister = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), new THREE.MeshBasicMaterial({ color: 0x424242 }));
        cashRegister.position.set(4.5, 1.25, 2);
        scene.add(cashRegister);

        // --- KHÁCH HÀNG 3D ---
        const customerGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.1, 8), new THREE.MeshBasicMaterial({ color: 0xe91e63 }));
        body.position.set(0, 0.55, 0);
        customerGroup.add(body);
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffccbc }));
        head.position.set(0, 1.3, 0);
        customerGroup.add(head);

        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), new THREE.MeshBasicMaterial({ color: 0x3e2723 }));
        hair.position.set(0, 1.42, -0.05);
        customerGroup.add(hair);

        customerGroup.position.set(5, 0, 12);
        scene.add(customerGroup);

        let money = 150;
        let carriedGoods = 0;
        let customerState = 'walking_in';
        let customerTargetZ = 4.5;

        // ĐẶT VỊ TRÍ XUẤT PHÁT AN TOÀN TRONG NHÀ (X: 0, Z: -3) VÀ KHÓA GÓC NHÌN QUAY VÀO TRONG
        camera.position.set(0, 1.6, -3);
        let yaw = 0; // Nhìn thẳng vào trong nhà
        let pitch = 0;

        function showMsg(txt) {
            const m = document.getElementById('message');
            m.innerText = txt;
            m.style.opacity = '1';
            setTimeout(() => { m.style.opacity = '0'; }, 2000);
        }

        const playerRadius = 0.4;
        function checkCollision(newX, newZ) {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const minX = obs.x - obs.width / 2 - playerRadius;
                const maxX = obs.x + obs.width / 2 + playerRadius;
                const minZ = obs.z - obs.depth / 2 - playerRadius;
                const maxZ = obs.z + obs.depth / 2 + playerRadius;

                if (newX >= minX && newX <= maxX && newZ >= minZ && newZ <= maxZ) {
                    return true;
                }
            }
            return false;
        }

        let isDragging = false;
        let prevX = 0, prevY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#action-btn') || e.target.closest('#joystick-base') || e.target.closest('#ui') || e.target.closest('#store-sign')) return;
            isDragging = true;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            for (let i = 0; i < e.touches.length; i++) {
                const currentX = e.touches[i].clientX;
                const currentY = e.touches[i].clientY;
                yaw -= (currentX - prevX) * 0.004;
                pitch -= (currentY - prevY) * 0.004;
                
                const maxPitch = Math.PI / 2.2;
                if (pitch > maxPitch) pitch = maxPitch;
                if (pitch < -maxPitch) pitch = -maxPitch;

                prevX = currentX;
                prevY = currentY;
                break;
            }
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, z: 0 };
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickTouchId = e.changedTouches[0].identifier;
        });

        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const rect = joystickBase.getBoundingClientRect();
                    let dx = touch.clientX - (rect.left + rect.width / 2);
                    let dy = touch.clientY - (rect.top + rect.height / 2);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxR = 45;
                    if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveVector.x = dx / maxR;
                    moveVector.z = dy / maxR;
                }
            }
        });

        const resetJoystick = () => {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        };
        joystickBase.addEventListener('touchend', resetJoystick);
        joystickBase.addEventListener('touchcancel', resetJoystick);

        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const px = camera.position.x;
            const pz = camera.position.z;

            if (Math.abs(px - (-8)) < 2.5 && Math.abs(pz - (-8)) < 2.5) {
                if (money >= 20) {
                    if (carriedGoods < 3) {
                        money -= 20;
                        carriedGoods++;
                        document.getElementById('money').innerText = money;
                        document.getElementById('carried-goods').innerText = carriedGoods;
                        showMsg("📦 Đã nhập 1 thùng hàng từ máy tính! (-20$)");
                    } else {
                        showMsg("⚠️ Tay bạn đã đầy thùng hàng (Tối đa 3)!");
                    }
                } else {
                    showMsg("❌ Không đủ tiền nhập hàng! Cần ít nhất 20$");
                }
                return;
            }

            if (Math.abs(px - 5) < 3 && Math.abs(pz - 2) < 3) {
                if (customerState === 'waiting') {
                    customerState = 'leaving';
                    money += 50;
                    document.getElementById('money').innerText = money;
                    showMsg("💵 Đã tính tiền cho khách thành công! +50$");
                } else if (customerState === 'walking_in') {
                    showMsg("⏳ Khách đang đi từ cửa vào quầy, chờ chút ông chủ!");
                } else {
                    showMsg("ℹ️ Khách đang rời đi, chờ khách mới tới nhé.");
                }
                return;
            }

            let interactedShelf = false;
            shelves.forEach(shelf => {
                if (Math.abs(px - shelf.x) < 2.2 && Math.abs(pz - shelf.z) < 2.2) {
                    interactedShelf = true;
                    if (!shelf.hasGoods) {
                        if (carriedGoods > 0) {
                            carriedGoods--;
                            shelf.hasGoods = true;
                            shelf.group.traverse((child) => {
                                if (child.isMesh && child.geometry.type === 'BoxGeometry' && child.scale.x === 1) {
                                    child.material = new THREE.MeshBasicMaterial({ color: 0x4caf50 });
                                }
                            });
                            document.getElementById('carried-goods').innerText = carriedGoods;
                            
                            const currentEmpty = shelves.filter(s => !s.hasGoods).length;
                            document.getElementById('empty-shelves').innerText = currentEmpty;
                            showMsg("🛒 Đã bầy hàng lên kệ thành công!");
                        } else {
                            showMsg("⚠️ Bạn đang cầm 0 thùng hàng! Hãy ra máy tính nhập hàng.");
                        }
                    } else {
                        showMsg("✅ Kệ hàng này đã được bầy đầy rồi!");
                    }
                }
            });

            if (!interactedShelf && Math.abs(px - (-8)) >= 2.5 && Math.abs(pz - (-8)) >= 2.5 && Math.abs(px - 5) >= 3) {
                showMsg("🚶 Hãy đến gần Máy tính, Quầy thu ngân hoặc Kệ hàng để tương tác!");
            }
        });

        const speed = 0.08;
        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.order = 'YXZ';
