<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Mart Simulator 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; user-select: none; }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 2px 2px 3px #000;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #ffeb3b;
        }
        #money { color: #00e676; font-size: 17px; }
        
        #store-sign {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 152, 0, 0.95);
            border: 2px solid #fff;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #message {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffeb3b;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            text-align: center;
            background: rgba(0,0,0,0.85);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ffeb3b;
            max-width: 80%;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            z-index: 15;
            pointer-events: none;
        }
        
        .control-btn {
            position: absolute;
            bottom: 50px;
            width: 75px;
            height: 75px;
            background: rgba(255, 235, 59, 0.25);
            border: 2px solid rgba(255, 235, 59, 0.8);
            border-radius: 50%;
            color: #ffeb3b;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        #action-btn { right: 25px; background: rgba(0, 230, 118, 0.35); border-color: #00e676; color: #00e676; font-size: 11px; text-align: center;}
        
        #joystick-base {
            position: absolute;
            bottom: 35px;
            left: 35px;
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
        }
        #joystick-knob {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.9);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 2px #000;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="ui">
        💰 Tiền: <span id="money">150</span>$<br>
        📦 Thùng hàng cầm tay: <span id="carried-goods">0</span>/3<br>
        🛒 Kệ trống cần bầy: <span id="empty-shelves">3</span>/3
    </div>
    
    <div id="store-sign">🏪 MINI MART SIMULATOR</div>

    <div id="crosshair"></div>
    <div id="message">Chào mừng ông chủ bắt đầu quản lý siêu thị!</div>
    <div id="hint">Vuốt màn hình để nhìn quanh | Dùng joystick bên trái để đi chuyển</div>

    <div id="action-btn" class="control-btn">TƯƠNG TÁC</div>
    <div id="joystick-base">
        <div id="joystick-knob"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        // Sàn nhà
        const floorGeo = new THREE.PlaneGeometry(22, 22);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0xecf0f1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Tường xung quanh siêu thị
        const wallMat = new THREE.MeshBasicMaterial({ color: 0xffecb3 });
        
        // Tường sau
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(22, 5, 0.5), wallMat);
        backWall.position.set(0, 2.5, -11);
        scene.add(backWall);

        // Tường trái
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 22), wallMat);
        leftWall.position.set(-11, 2.5, 0);
        scene.add(leftWall);

        // Tường phải
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 22), wallMat);
        rightWall.position.set(11, 2.5, 0);
        scene.add(rightWall);

        // Tường trước (có cửa kính)
        const frontLeft = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 0.5), wallMat);
        frontLeft.position.set(-6.5, 2.5, 11);
        scene.add(frontLeft);

        const frontRight = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 0.5), wallMat);
        frontRight.position.set(6.5, 2.5, 11);
        scene.add(frontRight);

        const frontTop = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.5), wallMat);
        frontTop.position.set(0, 4, 11);
        scene.add(frontTop);

        // Cửa kính
        const doorGlass = new THREE.Mesh(
            new THREE.BoxGeometry(3.8, 3, 0.1), 
            new THREE.MeshBasicMaterial({ color: 0x81d4fa, transparent: true, opacity: 0.5 })
        );
        doorGlass.position.set(0, 1.5, 11);
        scene.add(doorGlass);

        // Danh sách va chạm
        const obstacles = [
            { x: 0, z: -10.75, width: 22, depth: 0.5 },
            { x: -10.75, z: 0, width: 0.5, depth: 22 },
            { x: 10.75, z: 0, width: 0.5, depth: 22 },
            { x: -5, z: -7, width: 3.4, depth: 1.2 },
            { x: 0, z: -7, width: 3.4, depth: 1.2 },
            { x: 5, z: -7, width: 3.4, depth: 1.2 },
            { x: -8, z: -8, width: 2.7, depth: 1.5 },
            { x: 5, z: 2, width: 4.0, depth: 2.0 }
        ];

        // 3 Kệ hàng
        const shelves = [];
        const shelfMat = new THREE.MeshBasicMaterial({ color: 0x795548 });
        const shelfBoardMat = new THREE.MeshBasicMaterial({ color: 0xa1887f });

        [-5, 0, 5].forEach((xPos, index) => {
            const shelfGroup = new THREE.Group();
            
            const side1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), shelfMat);
            side1.position.set(-1.6, 1.25, 0);
            shelfGroup.add(side1);

            const side2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), shelfMat);
            side2.position.set(1.6, 1.25, 0);
            shelfGroup.add(side2);

            [0.3, 1.1, 1.9].forEach(yPos => {
                const board = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.95), shelfBoardMat);
                board.position.set(0, yPos, 0);
                shelfGroup.add(board);
            });

            shelfGroup.position.set(xPos, 0, -7);
            scene.add(shelfGroup);
            shelves.push({ id: index + 1, group: shelfGroup, hasGoods: false, x: xPos, z: -7 });
        });

        // Bàn máy tính
        const desk = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.0, 1.3), new THREE.MeshBasicMaterial({ color: 0x37474f }));
        desk.position.set(-8, 0.5, -8);
        scene.add(desk);

        const pcCase = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.7, 0.7), new THREE.MeshBasicMaterial({ color: 0x212121 }));
        pcCase.position.set(-8.8, 0.35, -8);
        scene.add(pcCase);

        const pcScreen = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.08), new THREE.MeshBasicMaterial({ color: 0x111111 }));
        pcScreen.position.set(-8, 1.35, -8);
        scene.add(pcScreen);

        const pcDisplay = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.02), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
        pcDisplay.position.set(-8, 1.35, -7.95);
        scene.add(pcDisplay);

        // Quầy thu ngân
        const counter = new THREE.Mesh(new THREE.BoxGeometry(3.8, 1.0, 1.8), new THREE.MeshBasicMaterial({ color: 0x0288d1 }));
        counter.position.set(5, 0.5, 2);
        scene.add(counter);

        // Khách hàng
        const customerGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.1, 8), new THREE.MeshBasicMaterial({ color: 0xe91e63 }));
        body.position.set(0, 0.55, 0);
        customerGroup.add(body);
        
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffccbc }));
        head.position.set(0, 1.3, 0);
        customerGroup.add(head);

        customerGroup.position.set(5, 0, 12);
        scene.add(customerGroup);

        let money = 150;
        let carriedGoods = 0;
        let customerState = 'walking_in';
        let customerTargetZ = 4.5;

        // Đặt vị trí camera an toàn trong nhà
        camera.position.set(0, 1.6, -2);
        let yaw = 0;
        let pitch = 0;

        function showMsg(txt) {
            const m = document.getElementById('message');
            m.innerText = txt;
            m.style.opacity = '1';
            setTimeout(() => { m.style.opacity = '0'; }, 2000);
        }

        const playerRadius = 0.4;
        function checkCollision(newX, newZ) {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                if (newX >= obs.x - obs.width/2 - playerRadius && newX <= obs.x + obs.width/2 + playerRadius &&
                    newZ >= obs.z - obs.depth/2 - playerRadius && newZ <= obs.z + obs.depth/2 + playerRadius) {
                    return true;
                }
            }
            return false;
        }

        let isDragging = false;
        let prevX = 0, prevY = 0;
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('#action-btn') || e.target.closest('#joystick-base') || e.target.closest('#ui')) return;
            isDragging = true;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let dx = e.touches[0].clientX - prevX;
            let dy = e.touches[0].clientY - prevY;
            yaw -= dx * 0.004;
            pitch -= dy * 0.004;
            if (pitch > 1.4) pitch = 1.4;
            if (pitch < -1.4) pitch = -1.4;
            prevX = e.touches[0].clientX;
            prevY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, z: 0 };
        let joystickTouchId = null;

        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickTouchId = e.changedTouches[0].identifier;
        });

        joystickBase.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    const rect = joystickBase.getBoundingClientRect();
                    let dx = touch.clientX - (rect.left + rect.width / 2);
                    let dy = touch.clientY - (rect.top + rect.height / 2);
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxR = 45;
                    if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
                    joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveVector.x = dx / maxR;
                    moveVector.z = dy / maxR;
                }
            }
        });

        const resetJoystick = () => {
            joystickTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            moveVector = { x: 0, z: 0 };
        };
        joystickBase.addEventListener('touchend', resetJoystick);
        joystickBase.addEventListener('touchcancel', resetJoystick);

        document.getElementById('action-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            const px = camera.position.x;
            const pz = camera.position.z;

            // Máy tính
            if (Math.abs(px - (-8)) < 2.5 && Math.abs(pz - (-8)) < 2.5) {
                if (money >= 20 && carriedGoods < 3) {
                    money -= 20;
                    carriedGoods++;
                    document.getElementById('money').innerText = money;
                    document.getElementById('carried-goods').innerText = carriedGoods;
                    showMsg("📦 Đã nhập 1 thùng hàng! (-20$)");
                } else {
                    showMsg("⚠️ Không đủ tiền hoặc đầy tay!");
                }
                return;
            }

            // Thu ngân
            if (Math.abs(px - 5) < 3 && Math.abs(pz - 2) < 3) {
                if (customerState === 'waiting') {
                    customerState = 'leaving';
                    money += 50;
                    document.getElementById('money').innerText = money;
                    showMsg("💵 Khách đã thanh toán! +50$");
                }
                return;
            }

            // Kệ hàng
            shelves.forEach(shelf => {
                if (Math.abs(px - shelf.x) < 2.2 && Math.abs(pz - shelf.z) < 2.2 && !shelf.hasGoods && carriedGoods > 0) {
                    carriedGoods--;
                    shelf.hasGoods = true;
                    shelf.group.traverse(child => {
                        if (child.isMesh && child.scale.x === 1) child.material = new THREE.MeshBasicMaterial({ color: 0x4caf50 });
                    });
                    document.getElementById('carried-goods').innerText = carriedGoods;
                    document.getElementById('empty-shelves').innerText = shelves.filter(s => !s.hasGoods).length;
                    showMsg("🛒 Đã bầy hàng lên kệ!");
                }
            });
        });

        const speed = 0.08;
        function animate() {
            requestAnimationFrame(animate);

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            if (customerState === 'walking_in') {
                customerGroup.position.z -= 0.03;
                if (customerGroup.position.z <= customerTargetZ) {
                    customerGroup.position.z = customerTargetZ;
                    customerState = 'waiting';
                    showMsg("🚨 Có khách đang chờ thanh toán!");
                }
            } else if (customerState === 'leaving') {
                customerGroup.position.z += 0.04;
                if (customerGroup.position.z > 13) {
                    customerGroup.position.set(5, 0, 12);
                    customerState = 'walking_in';
                }
            }

            if (moveVector.x !== 0 || moveVector.z !== 0) {
                const moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.z);
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                const nextX = camera.position.x + moveDir.x * speed;
                const nextZ = camera.position.z + moveDir.z * speed;
                if (!checkCollision(nextX, camera.position.z)) camera.position.x = nextX;
                if (!checkCollision(camera.position.x, nextZ)) camera.position.z = nextZ;
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
